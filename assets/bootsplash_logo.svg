<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Mountain Bakes mark: a mountain range over a loaf, in the brand's burnt-sugar
    and kiln-teal palette. Drawn on a transparent ground so react-native-bootsplash
    can composite it onto the splash background colour.
  -->
  <!-- Back peak -->
  <path d="M96 300 L188 156 L268 268 L300 224 L404 300 Z" fill="#D29F6C"/>
  <!-- Front peak -->
  <path d="M60 316 L168 168 L252 292 L292 240 L436 316 Z" fill="#A05F22"/>
  <!-- Snow cap -->
  <path d="M168 168 L206 222 L186 234 L162 216 L140 236 Z" fill="#FBF2E9"/>
  <!-- Loaf -->
  <rect x="104" y="330" width="304" height="112" rx="56" fill="#BC7F45"/>
  <!-- Scoring -->
  <path d="M168 372 L204 400" stroke="#FBF2E9" stroke-width="14" stroke-linecap="round"/>
  <path d="M238 366 L274 394" stroke="#FBF2E9" stroke-width="14" stroke-linecap="round"/>
  <path d="M308 372 L344 400" stroke="#FBF2E9" stroke-width="14" stroke-linecap="round"/>
  <!-- Kiln-teal accent, tying the mark to the interactive palette -->
  <circle cx="386" cy="152" r="30" fill="#16697A"/>
</svg>
