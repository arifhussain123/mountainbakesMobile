apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// react-native-config: pick the .env file per build type. envConfigFiles must be
// declared BEFORE dotenv.gradle is applied, or every Config.* value reads null.
project.ext.envConfigFiles = [
    debug  : ".env.development",
    release: ".env.production",
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion = rootProject.ext.ndkVersion
    buildToolsVersion = rootProject.ext.buildToolsVersion
    compileSdk = rootProject.ext.compileSdkVersion

    namespace = "com.mountainbakes.mobile"
    defaultConfig {
        applicationId "com.mountainbakes.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        /**
         * The upload key, supplied from OUTSIDE the repository.
         *
         * Put the four properties in `$GRADLE_USER_HOME/gradle.properties`
         * (`~/.gradle/gradle.properties` unless the Gradle home is relocated),
         * which is not
         * in any repo) or pass them as `-P` flags on the build command. A
         * keystore or its password committed here would be a signing identity in
         * every clone and every CI log, and rotating it means every installed
         * app has to be uninstalled before it can update.
         *
         * The block stays empty when the properties are absent — an unreferenced
         * signing config is legal, and `buildTypes.release` below decides
         * whether to use it.
         */
        release {
            if (project.hasProperty('MB_RELEASE_STORE_FILE')) {
                storeFile file(project.property('MB_RELEASE_STORE_FILE'))
                storePassword project.property('MB_RELEASE_STORE_PASSWORD')
                keyAlias project.property('MB_RELEASE_KEY_ALIAS')
                keyPassword project.property('MB_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            /*
             * The template shipped `signingConfig = signingConfigs.debug` here,
             * which silently produces a "release" APK signed with the PUBLIC
             * debug key — its password is the literal string "android" and it is
             * the same key on every React Native install on earth. Anyone can
             * re-sign that artefact and it will install over the real one. Play
             * rejects it outright.
             *
             * It still falls back, because failing the build would strand
             * anyone doing a local size or smoke check. What it does not do is
             * fall back QUIETLY: an unsigned-for-production build now says so
             * every time, so the state cannot survive to a store upload
             * unnoticed.
             */
            if (project.hasProperty('MB_RELEASE_STORE_FILE')) {
                signingConfig = signingConfigs.release
            } else {
                logger.warn("")
                logger.warn("  ⚠  RELEASE BUILD IS SIGNED WITH THE DEBUG KEY — NOT DISTRIBUTABLE.")
                logger.warn("     Set MB_RELEASE_STORE_FILE / _STORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD")
                logger.warn("     in \$GRADLE_USER_HOME/gradle.properties (usually ~/.gradle/).")
                logger.warn("     See docs/troubleshooting.md.")
                logger.warn("")
                signingConfig = signingConfigs.debug
            }
            minifyEnabled = enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    /**
     * `libworklets.so` arrives twice and the merge refuses to guess.
     *
     * react-native-gesture-handler 3.x links the worklets runtime through the
     * CMake IMPORTED target `react-native-worklets::worklets` (its
     * `android/src/main/jni/CMakeLists.txt`, guarded by `RNGH_USE_WORKLETS`).
     * AGP copies an imported shared library into the *consuming* module's
     * `library_jni` output, so `libworklets.so` is emitted by
     * react-native-gesture-handler AND by react-native-worklets itself, and
     * `:app:mergeDebugNativeLibs` fails with "2 files found with path
     * 'lib/arm64-v8a/libworklets.so'".
     *
     * RNGH's own `packagingOptions` already excludes the same class of
     * duplicate for `libreactnative.so`, `libjsi.so`, `libfbjni.so` and
     * `libc++_shared.so` — worklets is simply missing from that list, so the
     * exclusion has to happen here instead. Do not "fix" it in
     * `node_modules/`: the next `npm install` undoes it.
     *
     * `pickFirst`, not `exclude`: `exclude` drops the library from the APK
     * entirely and every Reanimated/RNGH worklet then dies at runtime with an
     * UnsatisfiedLinkError. Picking either copy is safe because both come out
     * of the same react-native-worklets CMake build — verified identical
     * `.text` and identical dynamic symbol tables; they differ only by a few KB
     * of non-code bytes, react-native-gesture-handler carrying the raw prefab
     * and react-native-worklets its own post-processed copy.
     */
    packaging {
        jniLibs {
            pickFirsts += ["**/libworklets.so"]
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
