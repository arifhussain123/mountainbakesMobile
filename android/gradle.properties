# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
#
# arm64-v8a ONLY, deliberately. Every native module (op-sqlite, reanimated,
# worklets, nitro, mmkv, svg, screens ...) compiles once per ABI, so the
# template's four-ABI default builds the same C++ four times: it is the bulk of
# a cold build's wall-clock and of its peak memory, and on a 15 GiB machine with
# swap already full that is where an OOM-killed ninja worker turns into a
# baffling Gradle failure. Measured on the debug APK: 235 MB -> 75 MB.
#
# The cost is real: this APK installs on arm64 hardware and NOTHING else. The
# development phone (SM-A127F) is arm64-v8a, as is every 64-bit Android device
# since 2019 -- but an x86_64 EMULATOR will refuse to install it, failing with
# INSTALL_FAILED_NO_MATCHING_ABIS rather than anything that names the cause.
# Add the ABI back for that run instead of editing this file:
#
#   ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64
#
# Restore the four-ABI list before cutting any build meant for distribution;
# armeabi-v7a is what 32-bit devices need and it is not here.
reactNativeArchitectures=arm64-v8a

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=false

# Silence the Gradle deprecation summary.
#
# Measured, not assumed. `./gradlew app:assembleDebug --warning-mode all` reports
# 36 problems, and the build's own problems-report.html attributes every one of
# them to code outside this repository:
#
#   15  Android Gradle Plugin  (com.android.internal.library / .application)
#        - multi-string dependency notation
#    6  Kotlin Gradle plugins  (kotlin-android, kotlin.jvm, kotlin.android)
#        - legacy `Usage` attribute value
#    6  node_modules/@op-engineering/op-sqlite/android/build.gradle
#    5  node_modules/react-native-blob-util/android/build.gradle
#    4  node_modules/react-native-bootsplash/android/build.gradle
#        - `propName value` instead of `propName = value`
#
# **Zero come from android/build.gradle, android/app/build.gradle or
# android/settings.gradle.** All three node modules are already pinned at their
# newest published release (op-sqlite 18.1.1, blob-util 0.24.10, bootsplash
# 7.3.2), so there is no upgrade that fixes them, and patching `node_modules`
# would be undone by the next `npm install`.
#
# So this hides a message rather than fixing a fault — because there is no fault
# here to fix. The cost is real and worth knowing: it also hides deprecations
# from OUR Gradle files. Before changing anything under `android/`, comment this
# out (or run with `--warning-mode all`) so your own mistakes are still visible.
#
# They become hard errors in Gradle 10, which this project is not on. Re-check
# then: `./gradlew app:assembleDebug --warning-mode all`.
org.gradle.warning.mode=none
